# Phone preview: every push to main rebuilds the landing as static files and publishes it on GitHub Pages at
# https://azizbeksultonov227-hub.github.io/morefin-mobile-landing/ . This is a preview, not the real site: the real
# one is the standalone server (Dockerfile), which also does the country-based language redirect.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only the newest push matters; an older build still running is dropped
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the static preview
        env:
          GITHUB_PAGES: "true" # next.config.ts: static export under /morefin-mobile-landing
        run: |
          # the country redirect (src/proxy.ts) needs a server; a static preview has none
          rm src/proxy.ts
          pnpm build
          # "/" is the Uzbek page (the server rewrites it; static hosting needs the file itself)
          cp out/uz/index.html out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
